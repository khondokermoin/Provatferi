# Fails the build when a commit anywhere in the repository contains a secret, or a file that must never be committed.
# Scanner: gitleaks (pinned and checksum-verified by scripts/install-gitleaks.sh). Policy: .gitleaks.toml. Rules: docs/SECRETS.md.
# Needs no repository secrets and has read-only access to the code.
name: Secret scan

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks (every commit of every branch and tag)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install the pinned scanner
        run: bash scripts/install-gitleaks.sh

      - name: Scan
        run: bash scripts/secret-scan.sh history
